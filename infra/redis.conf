# Redis configuration for Synapse development
# Phase 0: basic settings. Production hardening in Phase 7.

# Persistence: AOF for durability of telemetry streams
appendonly yes
appendfilename "synapse.aof"
appendfsync everysec

# Memory policy: when full, evict oldest stream entries first
maxmemory 512mb
maxmemory-policy allkeys-lru

# TCP keepalive
tcp-keepalive 300

# Streams: allow large streams for telemetry fan-in
stream-node-max-bytes 4096
stream-node-max-entries 100

# Disable RDB snapshots in dev (AOF only)
save ""

# Logging
loglevel notice
