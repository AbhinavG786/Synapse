[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# asyncio_mode = "auto"  # requires pytest-asyncio; enabled in Phase 5

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
