# F3: GC-pause-like stalls on backend-1
# 50 ms stop-the-world pauses every 500 ms from t=10s to t=50s.
# Expected: P99 tail latency spikes on backend-1; proxy should detect
# and reroute heavy requests away.

name: f3_gc_stalls
description: >
  Injects 50ms stop-the-world pauses every 500ms on backend-1.
  Tail latency spikes are periodic and may not trigger 5xx-based
  reactive checkers — a proactive bandit policy should respond faster.
fault_type: F3
target_nodes: [backend-1]

steps:
  - at_s: 0.0
    action: baseline

  - at_s: 10.0
    node: backend-1
    action: set_fault
    fault:
      F3PauseMs: 50.0
      F3PauseIntervalMs: 500.0

  - at_s: 50.0
    node: backend-1
    action: clear_fault

  - at_s: 80.0
    action: end

total_duration_s: 80
warmup_s: 10
